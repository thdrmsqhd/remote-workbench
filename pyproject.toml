[project]
name = "remote-workbench"
version = "0.1.0"
description = "SSH shell + tabs + SFTP file tree POC"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4.0",
  "textual>=0.80.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
remote-workbench = "remote_workbench.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
